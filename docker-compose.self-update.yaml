# Turns on the update button, by giving Relic Finder control of Docker itself.
#
# READ THIS BEFORE YOU USE IT. It is four lines of configuration and it is not a
# small change.
#
# /var/run/docker.sock is how programs give the Docker daemon orders. Anything
# that can reach it can start a container that mounts your whole disk, and read
# or change any file on this machine — whatever that container is nominally for.
# Adding the line below therefore gives Relic Finder the run of the machine, and
# not merely the run of its own container.
#
# So the question this file asks is not "do you want the button". It is: do you
# trust this application, and everything it fetches from warframe.market and
# GitHub, and every bug it has, with the whole computer. On a box that only ever
# runs Relic Finder, that is a reasonable yes. On the laptop you also do your
# banking on, it is a reasonable no — and saying no costs two commands, twice a
# year:
#
#   docker compose pull
#   docker compose up -d
#
# The dialog inside the application shows you those two commands whether or not
# this file is in use, so nothing is hidden from anybody who declines.
#
# WITH IT:
#
#   docker compose -f docker-compose.yaml -f docker-compose.self-update.yaml up -d
#
# Run it from the directory these files are in. ${PWD} below is read on the host
# while compose parses this, and it is how the updater finds the compose files
# again from inside the container — started from anywhere else it would name a
# directory that does not hold them.
#
# Both file names travel in RELICS_DOCKER_COMPOSE_FILES for the same reason the
# directory does: the updater re-runs compose with exactly the files you started
# with. Leave this one out of that list and the first update would recreate the
# backend without the mount, quietly switching the button back off.

services:
  backend:
    environment:
      - RELICS_DOCKER_UPDATE=true
      - RELICS_DOCKER_PROJECT_DIR=${PWD}
      - RELICS_DOCKER_COMPOSE_FILES=docker-compose.yaml:docker-compose.self-update.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
