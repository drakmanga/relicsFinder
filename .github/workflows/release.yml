# Builds the Windows installer, on Windows, because a .exe cannot honestly be
# built anywhere else: jpackage bundles a runtime for the machine it is running
# on, and Inno Setup is a Windows program.
#
# It runs on a tag, which is how a release is cut, and also on any pull request
# that touches the installer or the desktop code — that part of the repository
# is exercised by nothing else, and a mistake in it is otherwise found by a user
# rather than by CI.
#
# Three smoke tests. The first two are the two ways the installed application
# finds a Java, which fail differently; the third is the update path, which is
# how every user reaches a release now that the application installs one itself.
#
#   * the application image is started as it is, which uses the runtime jpackage
#     bundled — the path a machine with no Java takes;
#   * the installer is run silently and the copy it installed is started, which
#     on this runner finds the JDK setup-java put there and so exercises the
#     configuration file rewriting instead;
#   * the same setup is run again over that copy while it is running, with no
#     /DIR and with /RELAUNCH=yes — the way the application runs it when the
#     user clicks Update. A setup that stopped finding the previous install, or
#     stopped bringing the application back, would otherwise be found by a user
#     whose application vanished mid-update.
#
# CUTTING A RELEASE, and there is one manual step and it is not the one there
# used to be:
#
#   1. bump <revision> in pom.xml and commit it — that line is where the version
#      of Relic Finder is declared, and everything else reads it;
#   2. tag the commit v<the same three numbers> and push the tag.
#
# That is all. This workflow PUBLISHES the release rather than drafting it, and
# nobody has to remember to promote anything afterwards. It used to draft, which
# looked like the careful choice and was not: /releases/latest does not return a
# draft, so the update check inside every installed copy went on reporting the
# release before it, silently, for as long as the draft sat there. A release
# nobody is told about is not a release.
#
# Publishing straight out is safe here because the release is only created on a
# tag and only after all three smoke tests above have passed — a build that
# cannot start, or cannot be updated to, never reaches the step that publishes
# it. That gate matters more than it used to: every Windows install now takes a
# published release on its own, so nobody is left to notice a bad one first.

name: Windows installer

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "installer/**"
      - "src/main/java/relics/reliceApi/desktop/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the installer (three numbers)"
        required: false
        default: "0.1.0"

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installer:
    name: Build and smoke test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Windows records three numbers and nothing else, so a tag is stripped
      # down to them: v1.2.3 becomes 1.2.3, and a run that is not a release
      # gets 0.0.0 rather than pretending to be one.
      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $pom = [xml] (Get-Content pom.xml -Raw)
          $declared = $pom.project.properties.revision -replace '-SNAPSHOT$', ''

          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $version = $ref -replace "^refs/tags/v", ""
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "0.0.0"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not three numbers, which is all jpackage accepts."
          }

          # The tag does not get to say something the repository does not. A tag
          # and a pom that disagree produce an installer stamped with one number
          # and a jar reporting another, which is the exact fault the single
          # <revision> exists to remove — and it would only surface months later,
          # as an update notice that never goes away.
          if ($ref -like "refs/tags/v*" -and $version -ne $declared) {
            throw "Tag v$version does not match <revision> $declared in pom.xml. Bump the pom, commit, then tag."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version (pom declares $declared)"

      # Pinned rather than taken from the runner image: the version that image
      # happens to carry has changed under us before, and the script needs 6.3
      # or later for its architecture identifiers.
      - name: Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile innosetup.exe
          Start-Process -Wait -FilePath .\innosetup.exe `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            throw 'Inno Setup did not install'
          }

      - name: Build the installer
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\installer\windows\build.ps1 -Version ${{ steps.version.outputs.version }}

      # The application image with its own runtime, started the way a machine
      # with no Java would start it. Proves the bundled runtime can boot Spring,
      # that the frontend really is inside the jar, and that the launcher writes
      # down the port it ended up on.
      - name: Smoke test — bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home_ = "$env:LOCALAPPDATA\RelicFinder"
          Remove-Item $home_ -Recurse -Force -ErrorAction SilentlyContinue

          $exe = ".\build\windows\app-image\RelicFinder\RelicFinder.exe"
          Start-Process -FilePath $exe -ArgumentList '--relics.desktop.browser=false'

          $port = $null
          foreach ($attempt in 1..90) {
            if (Test-Path "$home_\port") {
              $port = (Get-Content "$home_\port" -Raw).Trim()
              if ($port) { break }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $port) {
            Write-Host '--- log ---'
            Get-Content "$home_\logs\relic-finder.log" -ErrorAction SilentlyContinue
            throw 'The application never recorded a port'
          }
          Write-Host "Answering on $port"

          $api = Invoke-WebRequest "http://127.0.0.1:$port/api/relics" -UseBasicParsing
          if ($api.StatusCode -ne 200) { throw "The API answered $($api.StatusCode)" }

          # The whole point of building the frontend into the jar: one process
          # serves both, so a page here means the static resources made it in.
          $page = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
          if ($page.Content -notmatch '<div id="root"') { throw 'The page served is not the application' }

          Write-Host 'Bundled runtime: the application starts and serves both.'
          Stop-Process -Name RelicFinder -Force -ErrorAction SilentlyContinue

      # The installer itself, and the copy it leaves behind. This runner has a
      # JDK 25 with JAVA_HOME pointing at it, so the wizard takes its silent
      # default and uses it — which is the path that rewrites the launcher's
      # configuration file, and the one no other test covers.
      - name: Smoke test — installed copy, using the runner's Java
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home_ = "$env:LOCALAPPDATA\RelicFinder"
          $target = "$env:RUNNER_TEMP\RelicFinderInstalled"

          Get-Process RelicFinder -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Remove-Item "$home_\port" -Force -ErrorAction SilentlyContinue

          $setup = Get-ChildItem .\build\windows\installer -Filter '*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$target"

          $cfg = Get-Content "$target\app\RelicFinder.cfg" -Raw
          Write-Host "--- RelicFinder.cfg ---`n$cfg"

          if ($cfg -notmatch '(?m)^app\.runtime=') {
            throw 'The installer found no Java on a runner that has one: the detection is broken.'
          }
          if (Test-Path "$target\runtime") {
            throw 'The bundled runtime was installed even though the machine Java was chosen.'
          }

          Start-Process -FilePath "$target\RelicFinder.exe" -ArgumentList '--relics.desktop.browser=false'

          $port = $null
          foreach ($attempt in 1..90) {
            if (Test-Path "$home_\port") {
              $port = (Get-Content "$home_\port" -Raw).Trim()
              if ($port) { break }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $port) {
            Write-Host '--- log ---'
            Get-Content "$home_\logs\relic-finder.log" -ErrorAction SilentlyContinue
            throw 'The installed copy never recorded a port'
          }

          $api = Invoke-WebRequest "http://127.0.0.1:$port/api/relics" -UseBasicParsing
          if ($api.StatusCode -ne 200) { throw "The API answered $($api.StatusCode)" }

          Write-Host 'Installed copy: runs on the Java already on the machine.'
          Stop-Process -Name RelicFinder -Force -ErrorAction SilentlyContinue

      # The update path, which is the one a user takes from now on: the same
      # setup run over the copy already installed, with no /DIR and with the
      # switch the application passes. It proves three things nothing else
      # does — that a setup finds the previous install by itself, that it
      # replaces files the running application is holding open, and that
      # /RELAUNCH=yes brings the application back.
      - name: Smoke test — updating in place over a running copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home_ = "$env:LOCALAPPDATA\RelicFinder"
          $target = "$env:RUNNER_TEMP\RelicFinderInstalled"

          Remove-Item "$home_\port" -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath "$target\RelicFinder.exe" -ArgumentList '--relics.desktop.browser=false'

          # The setup has to find a copy holding its own jar open, which is the
          # state every real update runs against.
          foreach ($attempt in 1..90) {
            if (Test-Path "$home_\port") { break }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path "$home_\port")) { throw 'The installed copy did not start before the update' }
          Remove-Item "$home_\port" -Force

          # The same switches WindowsUpdateInstaller passes, because the point
          # is to exercise what the application actually runs — including
          # /FORCECLOSEAPPLICATIONS, without which a silent setup closes nothing
          # and meets a jar this test is still holding open.
          $setup = Get-ChildItem .\build\windows\installer -Filter '*.exe' | Select-Object -First 1
          $run = Start-Process -PassThru -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', `
                          '/FORCECLOSEAPPLICATIONS', '/RELAUNCH=yes', '/LOG=update-setup.log'

          # -PassThru and WaitForExit rather than -Wait, and the difference is
          # the whole reason this step once hung for twenty minutes in silence.
          # -Wait waits for the process AND ITS DESCENDANTS, and the last thing
          # this setup does is start the application and leave it running — so
          # -Wait blocks forever on exactly the process the test is here to see
          # come back. It only ever returned while the relaunch was broken.
          if (-not $run.WaitForExit(300000)) {
            $run.Kill()
            Write-Host '--- setup log ---'
            Get-Content 'update-setup.log' -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw 'The setup did not finish within five minutes'
          }
          Write-Host "The setup exited $($run.ExitCode)"

          # No /DIR was passed, so anything under $target is the previous
          # location being remembered rather than the default being used.
          if (-not (Test-Path "$target\app\RelicFinder.cfg")) {
            throw 'The update did not install over the previous location'
          }

          $port = $null
          foreach ($attempt in 1..90) {
            if (Test-Path "$home_\port") {
              $port = (Get-Content "$home_\port" -Raw).Trim()
              if ($port) { break }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $port) {
            # Both logs, because the two failures look identical from here and
            # are fixed in different files: the setup's says whether it closed
            # the running copy and reached the Run entry at all, and the
            # application's says whether the copy it started then died.
            Write-Host '--- setup log ---'
            Get-Content 'update-setup.log' -ErrorAction SilentlyContinue | Select-Object -Last 60
            Write-Host '--- application log ---'
            Get-Content "$home_\logs\relic-finder.log" -ErrorAction SilentlyContinue
            Write-Host '--- previous application log ---'
            Get-Content "$home_\logs\relic-finder.log.1" -ErrorAction SilentlyContinue
            throw 'The setup did not bring the application back with /RELAUNCH=yes'
          }

          $api = Invoke-WebRequest "http://127.0.0.1:$port/api/relics" -UseBasicParsing
          if ($api.StatusCode -ne 200) { throw "The relaunched copy answered $($api.StatusCode)" }

          Write-Host 'Update in place: replaced a running copy and brought it back.'
          Stop-Process -Name RelicFinder -Force -ErrorAction SilentlyContinue

      # The application writes its log into the user's AppData, which is outside
      # the workspace and so out of reach of the upload — it is fetched into the
      # workspace first. This is the only record of why a start failed, since
      # the launcher has no console to print to.
      - name: Collect the application log when something failed
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\failure-logs -Force | Out-Null
          Copy-Item "$env:LOCALAPPDATA\RelicFinder\logs\*" .\failure-logs `
            -ErrorAction SilentlyContinue

      - name: Keep the application log when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: application-log
          path: failure-logs
          if-no-files-found: ignore

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: RelicFinder-${{ steps.version.outputs.version }}-setup
          path: build\windows\installer\*.exe
          if-no-files-found: error

      # Published, not drafted. /releases/latest skips a draft, so a drafted
      # release is invisible to the update check in every installed copy — see
      # the note at the top of this file.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build\windows\installer\*.exe
          draft: false
          generate_release_notes: true
