# What a stranger runs. `docker compose up -d` and nothing else: the images come
# from the registry a release pushes them to, so this works on a machine that has
# never seen the sources and has no Java, no Node and no clone.
#
# It used to say `build:` here, which meant updating was `git pull` and a
# recompile — minutes of work, available only to somebody who had the repository
# in the first place, and no route at all for anyone who was handed a compose
# file. Building is still how this is developed; it moved to
# docker-compose.build.yaml, which is an addition rather than a replacement:
#
#   docker compose -f docker-compose.yaml -f docker-compose.build.yaml up -d --build
#
# RELICS_VERSION pins a release. Unset, it follows `latest`, which the newest
# release moves — which is what makes `docker compose pull && docker compose up -d`
# an update.
#
#   RELICS_VERSION=0.4.0 docker compose up -d
#
# RELICS_IMAGE_BACKEND and RELICS_IMAGE_FRONTEND exist for a fork publishing
# under its own name, and for the tests that run this file against a local
# registry. Neither needs setting to use this.

# Named rather than taken from the directory this file sits in: a project named
# after a folder is named differently for everybody who cloned into a different
# folder, so the same install answers to two names depending on where it was put
# and `docker compose down` in the wrong one finds nothing to stop.
name: relic-finder

services:
  backend:
    image: ${RELICS_IMAGE_BACKEND:-ghcr.io/drakmanga/relicsfinder-backend}:${RELICS_VERSION:-latest}
    container_name: relics-finder-backend
    volumes:
      - ./data:/app/data
    environment:
      - RELICS_CATALOGUE_PATH=data/relics.json
    ports:
      - "8080:8080"
    networks:
      - relics-finder-network
    restart: unless-stopped

  frontend:
    image: ${RELICS_IMAGE_FRONTEND:-ghcr.io/drakmanga/relicsfinder-frontend}:${RELICS_VERSION:-latest}
    container_name: relics-finder-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - relics-finder-network
    restart: unless-stopped

networks:
  relics-finder-network:
    driver: bridge
