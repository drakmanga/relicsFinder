services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: relics-finder-backend
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    networks:
      - relics-finder-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: relics-finder-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - relics-finder-network
    restart: unless-stopped

networks:
  relics-finder-network:
    driver: bridge
