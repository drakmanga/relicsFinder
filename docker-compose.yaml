services:
  backend:
    image: eclipse-temurin:25-jdk
    container_name: relics-finder-backend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: ./mvnw spring-boot:run
    networks:
      - relics-finder-network
    restart: unless-stopped

  frontend:
    image: node:20
    container_name: relics-finder-frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - RELICS_API_URL=http://backend:8080
    command: >
      sh -c "
      npm install &&
      npm run build:ui &&
      cd apps/web &&
      npx vite --host 0.0.0.0 --port 5173
      "
    depends_on:
      - backend
    networks:
      - relics-finder-network
    restart: unless-stopped

networks:
  relics-finder-network:
    driver: bridge
