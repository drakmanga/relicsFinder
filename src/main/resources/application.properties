spring.application.name=reliceApi

# La wishlist e un file su disco: il servizio e self-hosted e a utente singolo.
relics.wishlist.path=data/wishlist.json

# Il referto dei nomi che warframe.market non conosce. Un 404 e uno slug
# costruito male, non un item senza venditori: si corregge il nome a mano, a
# processo chiuso, quindi il referto e un file e non un endpoint.
relics.unknown-items.path=data/unknown-items.txt

# Da dove arriva la risposta "esiste una versione piu nuova". Il repository e
# l'immagine sono configurazione perche un fork che si autoaggiorna deve poter
# puntare al proprio, senza ricompilare; il TTL perche il limite di GitHub e per
# indirizzo IP e un host Docker dietro NAT ne condivide uno con tutti.
relics.update.repository=drakmanga/relicsFinder
relics.update.image=ghcr.io/drakmanga/relicsfinder
relics.update.ttl=PT1H

# Ogni quanto una vista puo essere riletta su richiesta. Il guardiano sta qui e
# non nel browser: il limite di warframe.market e per indirizzo, e un host
# Docker dietro NAT lo divide con tutti quelli che ci stanno dietro, quindi una
# guardia per scheda sarebbe tante guardie quante le schede.
#
# Il catalogo (Ducanetor e Tier List) sono le tabelle dei drop piu il database
# degli item: due host che non spendono il budget del mercato, e che pubblicano
# al ritmo delle build del gioco. Quindici minuti tengono un F5 premuto a
# quattro giri l'ora e restano molto piu fitti del refresh giornaliero.
#
# Gli ordini Ayatan sono ordini aperti che scadono in minuti, quindi il ritmo
# naturale e il minuto; una passata costa undici richieste al mercato, circa
# quattro secondi di budget condiviso.
relics.refresh.catalogue-cooldown=PT15M
relics.refresh.orders-cooldown=PT1M
